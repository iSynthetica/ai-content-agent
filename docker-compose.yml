# Фаза 0 — інфраструктурні шви. Сервіси застосунків (web/api/worker) додаються у Фазі 2 (INFRA-3/4).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forteq_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: forteq
    ports: ["5433:5432"]   # 5433 на хості — 5432 зайнятий іншим локальним postgres
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forteq_owner -d forteq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  redisdata:
  miniodata:
