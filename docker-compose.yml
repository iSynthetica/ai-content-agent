# Повний стек: інфраструктура + три застосунки.
#
# УВАГА ПРО ПОРТИ: усередині мережі compose сервіси звертаються до postgres на 5432, а не 5433.
# 5433 — це лише мапінг НА ХОСТ (5432 зайнятий локальним postgres розробника). Переплутати ці
# два числа — найчастіша причина «в докері не конектиться, а локально працює».
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: forteq_owner
      POSTGRES_PASSWORD: owner
      POSTGRES_DB: forteq
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forteq_owner -d forteq"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

  api:
    build: { context: ., target: api }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      # forteq_app — рантайм-роль під RLS. owner використовується лише для міграцій.
      DATABASE_URL: postgres://forteq_app:app@postgres:5432/forteq
      DATABASE_MIGRATE_URL: postgres://forteq_owner:owner@postgres:5432/forteq
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      CORS_ORIGIN: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      LOG_LEVEL: info
    ports: ["4000:4000"]

  worker:
    build: { context: ., target: worker }
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://forteq_app:app@postgres:5432/forteq
      REDIS_URL: redis://redis:6379
      IMAGE_DIR: /data/images
      # Без ключа worker НЕ стартує — це навмисно (ADR-0014): мовчазна генерація фейкового
      # контенту небезпечніша за відмову піднятися. Для демо без ключа: FAKE_MODELS=1.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FAKE_MODELS: ${FAKE_MODELS:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      LOG_LEVEL: info
    volumes: ["images:/data/images"]

  web:
    build:
      context: .
      target: web
      args:
        # NEXT_PUBLIC_* вшиваються у бандл на етапі build, а не читаються в рантаймі.
        NEXT_PUBLIC_APP_URL: http://localhost:3000
    depends_on: [api]
    environment:
      # Браузер ходить на localhost:4000, а сам Next (SSR/проксі) — на api:4000 всередині мережі.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
  miniodata:
  images:
