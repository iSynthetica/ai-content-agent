# Продакшн-стек для одного VPS (Hetzner Cloud). Самостійний файл, НЕ overlay на docker-compose.yml.
#
# Головна відмінність від локального compose - БЕЗПЕКА поверхні:
#   - postgres / redis НЕ публікуються на хост, живуть лише у внутрішній мережі;
#   - api і worker теж без публічних портів;
#   - назовні дивиться ЛИШЕ caddy (80/443), який проксує на web;
#   - minio прибрано - у рантаймі використовується локальне сховище зображень (LocalImageStore).
#
# Запуск (з кореня репозиторію):
#   docker compose --env-file deploy/.env.prod -f deploy/compose.prod.yml up -d --build
#
# context: .. бо цей файл лежить у deploy/, а контекст збірки - корінь репозиторію.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forteq_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set in .env.prod}
      POSTGRES_DB: forteq
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forteq_owner -d forteq"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Жодного ports: - база доступна лише сервісам усередині мережі.

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set in .env.prod}"]
    volumes: ["redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: { context: .., target: api }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://forteq_app:${POSTGRES_APP_PASSWORD:?}@postgres:5432/forteq
      DATABASE_MIGRATE_URL: postgres://forteq_owner:${POSTGRES_OWNER_PASSWORD}@postgres:5432/forteq
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      API_PORT: 4000
      CORS_ORIGIN: https://${DOMAIN:?set in .env.prod}
      AUTH_SECRET: ${AUTH_SECRET:?set a strong secret in .env.prod}
      LOG_LEVEL: info
    # Без ports: api доступний лише web-сервісу по внутрішній мережі.

  worker:
    build: { context: .., target: worker }
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://forteq_app:${POSTGRES_APP_PASSWORD}@postgres:5432/forteq
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      IMAGE_DIR: /data/images
      # Без ключа worker НЕ стартує (ADR-0014). Для демо без ключа: FAKE_MODELS=1 у .env.prod.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      FAKE_MODELS: ${FAKE_MODELS:-}
      LOG_LEVEL: info
    volumes: ["images:/data/images"]

  web:
    build:
      context: ..
      target: web
    restart: unless-stopped
    depends_on: [api]
    environment:
      # Браузер ходить на web відносними шляхами /api/*; web (SSR/проксі) звертається до api
      # по внутрішній мережі. Домен у білд НЕ вшивається - застосунок працює на будь-якому origin.
      API_INTERNAL_URL: http://api:4000
      NEXT_PUBLIC_APP_URL: https://${DOMAIN}
      AUTH_SECRET: ${AUTH_SECRET}
    # Без публічного порту - назовні дивиться лише caddy.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [web]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro   # origin.pem + origin.key з Cloudflare
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  redisdata:
  images:
  caddy_data:
  caddy_config:
